workflows:
  android-release:
    name: Android Release Build
    instance_type: linux_x2
    max_build_duration: 120
    
    environment:
      android_signing:
        - theone_keystore
      vars:
        FLUTTER_VERSION: "3.41.2"
        PACKAGE_NAME: "com.theone.theone_flutter"
        
    triggering:
      events:
        - push
        - tag
      branch:
        patterns:
          - pattern: 'master'
            include: true
        
    scripts:
      - name: Get Flutter version
        script: |
          flutter --version
          
      - name: Get dependencies
        script: |
          flutter pub get
          
      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER \
            --target-platform=android-arm64
            
      - name: Build AAB (Android App Bundle)
        script: |
          flutter build appbundle \
            --release \
            --build-number=$BUILD_NUMBER
            
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      
    publishing:
      email:
        recipients:
          - pierleonimarco2020@gmail.com
        notify:
          success: true
          failure: true
